<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="icon" href="img/favicon.ico" sizes="any"/>
</head>
<body>

<section class="profile-card">
    <img src="img/profile.png" alt="profile-picture" class="profile-picture"/>
    <h2 class="profile-name">Sarah Dole</h2>
    <p class="profile-title">Front End Engineer @ Microsoft</p>
    <p class="profile-description">
        I turn coffee into bugs which are fixed by someone else. Certified Stack Overflow and ChatGPT developer.
    </p>
    <button class="profile-button">Contact me</button>
    <div class="social-links">
        <a href="#">
            <img src="img/social/btn-github.svg" alt="github-icon" class="social-icons"
                 aria-label="Link to the GitHub profile">
        </a>
        <a href="#">
            <img src="img/social/btn-linkedin.svg" alt="linkedin-icon" class="social-icons"
                 aria-label="Link to the LinkedIn profile">
        </a>
        <a href="#">
            <img src="img/social/btn-instagram.svg" alt="instagram-icon" class="social-icons"
                 aria-label="Link to the Instagram profile">
        </a>
        <a href="#">
            <img src="img/social/btn-x.svg" alt="x-icon" class="social-icons"
                 aria-label="Link to the X profile">
        </a>
    </div>
</section>

<div class="credits" data-gfe-screenshot-exclude="true">
    A challenge by
    <a
            href="https://www.greatfrontend.com/projects?ref=challenges"
            target="_blank"
    >GreatFrontEnd Projects</a
    >. Built by
    <a
            href="https://www.greatfrontend.com/projects/u/ishahammam"
            target="_blank"
    >Isha Hammam</a
    >.
</div>
</body>
</html>
